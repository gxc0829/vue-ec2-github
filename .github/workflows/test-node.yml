name: Test Node Setup

on:
  push:
    branches: [ main ]

jobs:
  test-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Print Node Version
        run: node -v
# force trigger
